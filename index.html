<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전세계 양극재·음극재 생산능력 모니터링</title>
<style>
:root{--fg:#1f2328;--muted:#656d76;--bg:#ffffff;--panel:#ffffff;--soft:#f6f8fa;--line:#d0d7de;--ok:#1a7f37;--warn:#9a6700;--bad:#cf222e;--est:#8250df;--radius:8px;color-scheme:light}
*{box-sizing:border-box}
html,body{background:#ffffff}
body{margin:0;color:var(--fg);font-family:"Noto Sans KR",-apple-system,"Segoe UI",sans-serif;font-size:15px}
.cap{max-width:1280px;margin:0 auto;padding:20px 16px 48px;display:flex;flex-direction:column;gap:22px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.lang{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap}
.lang button{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);background:#fff;color:var(--fg);cursor:pointer}
.lang button:first-of-type{border-radius:var(--radius) 0 0 var(--radius)}
.lang button:last-of-type{border-radius:0 var(--radius) var(--radius) 0;margin-left:-1px}
.lang button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
h1{font-weight:500;font-size:26px;margin:0}
h2{font-size:18px;font-weight:600;margin:0 0 10px}
h3{font-size:15px;font-weight:600;margin:16px 0 4px}
.sub{color:var(--muted);font-size:12px;margin:6px 0 0}
.lead{margin:10px 0 0;line-height:1.7}
.lead b{font-variant-numeric:tabular-nums}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.note{color:var(--muted);font-size:12px;margin:10px 0 0;line-height:1.6}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:600;white-space:nowrap;background:var(--soft)}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
th.num{text-align:right}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
select,.btn,.tabs button{font:inherit;font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:var(--radius);background:#fff;color:var(--fg);cursor:pointer}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.tabs button.on{background:var(--fg);color:#fff;border-color:var(--fg)}
.st{white-space:nowrap;font-weight:600}.st-ok{color:var(--ok)}.st-warn{color:var(--warn)}.st-bad{color:var(--bad)}.st-mute{color:var(--muted)}
.est{color:var(--est)}
.badge{display:inline-block;font-size:10px;padding:0 4px;border:1px solid var(--est);color:var(--est);border-radius:4px;margin-left:4px;vertical-align:1px;font-weight:600}
a{color:inherit}
.hot td{color:var(--bad)}
details summary{cursor:pointer;font-weight:600}
details ul{line-height:1.7;margin:8px 0 0;padding-left:1.2em}
.ov{display:flex;flex-direction:column;gap:12px}
.ov-row{display:grid;grid-template-columns:minmax(100px,150px) 1fr;gap:8px;align-items:center}
.ov-label{font-size:12px}.ov-label b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.ov-bar{display:flex;height:30px;border-radius:var(--radius);overflow:hidden;background:var(--soft)}
.ov-seg{display:flex;align-items:center;padding:0 6px;font-size:12px;color:#fff;white-space:nowrap;overflow:hidden;min-width:0}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
.hier tr.l0 td{font-weight:600;border-bottom:2px solid var(--line);background:var(--soft)}
.hier tr.l1 td{font-weight:600}.hier tr.l1 td.name{cursor:pointer}
.hier tr.l2 td.name{padding-left:28px;font-weight:400}
.hier td.barc{min-width:120px;width:24%}
.hbar{height:12px;border-radius:2px;min-width:1px}
.tg{display:inline-block;width:14px;color:var(--muted)}
.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.xt td.cell{cursor:pointer;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.xt td.cell:hover{outline:1px solid var(--muted)}
.xt td.sel{outline:2px solid var(--fg)}
.xt td.zero{color:var(--muted)}
.xt th.rowh{position:sticky;left:0;background:var(--soft)}
.xt tr.tot td,.xt td.tot,tr.tot td{font-weight:600}
.xt tr.tot td,table.sum tr.tot td{border-top:2px solid var(--line)}
th[data-sort]{cursor:pointer;user-select:none}
th[aria-sort=descending]::after{content:' ▼';font-size:9px}
th[aria-sort=ascending]::after{content:' ▲';font-size:9px}
footer{color:var(--muted);font-size:11px}
@media (max-width:640px){.top{flex-direction:column-reverse}.lang{align-self:flex-end}}
</style>
</head>
<body>
<div class="cap">
  <header>
    <div class="top">
      <div>
        <h1 data-i="title"></h1>
        <p class="sub" data-i="subtitle"></p>
      </div>
      <div class="lang"><span>Language</span><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="en">English</button></div>
    </div>
    <p class="lead" id="takeaway"></p>
  </header>

  <section class="card">
    <h2 data-i="s1"></h2>
    <div class="legend" id="legend"></div>
    <div class="ov" id="overview"></div>
    <p class="note" data-i="s1note"></p>

    <p class="note" data-i="s1bnote"></p>
  </section>

  <section class="card">

    </tr></thead><tbody id="hier-body"></tbody></table></div>
    <p class="note" data-i="s2note"></p>
  </section>

  <section class="card">
    <h2 data-i="s3"></h2>
    <div class="tabs" id="x-tabs"><button data-m="양극재" class="on"></button><button data-m="음극재"></button><button data-m="전구체·원료"></button></div>
    <div class="filters">
      <select id="x-chem"></select>
      <select id="x-metric"><option value="current" data-i="mCur"></option><option value="target" data-i="mTgt"></option><option value="sites" data-i="mSites"></option></select>
      <select id="x-axis"><option value="region" data-i="axRegion"></option><option value="country" data-i="axCountry"></option><option value="company" data-i="axCompany"></option></select>
      <select id="x-rowsort"><option value="size" data-i="rsBig"></option><option value="small" data-i="rsSmall"></option><option value="name" data-i="rsName"></option></select>
    </div>
    <div class="wrap"><table class="xt"><tbody id="cross-body"></tbody></table></div>
    <p class="note" data-i="s3note"></p>
    <h3 data-i="s3detail"></h3>
    <p class="note" id="xsel"></p>
    <div class="wrap"><table id="cross-detail"><thead><tr>
      <th data-sort="hq" data-i="cHq"></th><th data-sort="parent" data-i="cParent"></th><th data-sort="company" data-i="cCompany"></th><th data-sort="chem" data-i="cChem"></th><th data-sort="site_country" data-i="cSite"></th><th data-i="cLoc"></th>
      <th class="num" data-sort="current_t" data-i="cCur"></th><th class="num" data-sort="target_t" data-i="cTgt"></th><th data-sort="status" data-i="cStatus"></th><th data-i="cChange"></th>
    </tr></thead><tbody id="xdetail"></tbody></table></div>
  </section>

  <section class="card">
    <h2 data-i="s4"></h2>
    <div class="filters">
      <select id="f-group"></select><select id="f-site"></select><select id="f-material"></select><select id="f-chem"></select><select id="f-status"></select><select id="f-basis"></select>
    </div>
    <div class="wrap"><table id="plants-table"><thead><tr>
      <th data-sort="group" data-i="cGroup"></th><th data-sort="hq" data-i="cHq"></th><th data-sort="material" data-i="cMat"></th><th data-sort="chem" data-i="cChem"></th><th data-sort="type" data-i="cType"></th><th data-sort="parent" data-i="cParent"></th><th data-sort="company" data-i="cCompany"></th><th data-sort="site_country" data-i="cSite"></th><th data-i="cLoc"></th>
      <th class="num" data-sort="current_t" data-i="cCur"></th><th data-sort="cur_basis" data-i="cCurBasis"></th><th class="num" data-sort="target_t" data-i="cTgt"></th><th data-sort="target_year" data-i="cYear"></th><th data-sort="status" data-i="cStatus"></th><th data-i="cCust"></th><th data-i="cChange"></th><th data-i="cEstMethod"></th><th data-i="cSrcDate"></th><th data-i="cSrc"></th>
    </tr></thead><tbody id="plants-body"></tbody></table></div>
    <p class="note" data-i="s4note"></p>
  </section>

  <section class="card">
    <h2 data-i="s5"></h2>
    <div class="wrap"><table><thead><tr><th data-i="iMetric"></th><th class="num" data-i="iValue"></th><th data-i="iPeriod"></th><th data-i="iNote"></th><th data-i="iSource"></th></tr></thead><tbody id="china-body"></tbody></table></div>
    <p class="note" data-i="s5note"></p>
  </section>

  <section class="card">
    <h2 data-i="s6"></h2>
    <div class="wrap"><table><thead><tr><th data-i="pDate"></th><th data-i="pRegion"></th><th data-i="pItem"></th><th data-i="pImpact"></th><th data-i="pCheck"></th><th data-i="cSrc"></th></tr></thead><tbody id="policy-body"></tbody></table></div>
    <p class="note" data-i="s6note"></p>
  </section>

  <details class="card">
    <summary data-i="unvTitle"></summary>
    <ul id="unv"></ul>
  </details>
  <footer data-i="footer"></footer>
</div>

const VAL_EN = Object.assign({'삼원계(NCM·NCA)':'Ternary (NCM/NCA)','LFP·LMFP':'LFP/LMFP','LCO':'LCO','기타 양극재':'Other cathode (LNMO/LMR/Na)','혼합':'Mixed','인조흑연':'Synthetic graphite','천연흑연':'Natural graphite','실리콘계':'Silicon-based','하드카본':'Hard carbon','전구체·원료':'Precursors & raw materials','양극재':'Cathode','음극재':'Anode','합계':'Total','미확인':'Unverified','기타':'Other'}, EN.values || {});
let LANG = 'ko';
const T = (k) => (I18N[LANG][k] ?? I18N.ko[k] ?? k);
const V = (v) => LANG === 'en' ? (VAL_EN[v] ?? v) : v;
const F = (p, k) => LANG === 'en' && EN.plants && EN.plants[p.id] && EN.plants[p.id][k] ? EN.plants[p.id][k] : (p[k] || '');

const GROUPS = ['중국','한국','일본','유럽','미국','기타'];
const COLORS = ['#d1495b','#2e86ab','#edae49','#66a182','#6c5b7b','#8d99ae'];
const MATS = ['양극재','음극재','전구체·원료'];
const CHEMS = {'양극재':['삼원계(NCM·NCA)','LFP·LMFP','LCO','기타 양극재','혼합'],'음극재':['인조흑연','천연흑연','실리콘계','하드카본'],'전구체·원료':['전구체·원료']};
const gColor = (g) => COLORS[GROUPS.indexOf(g)] || '#999';
const num = (v) => { const n = Number(v); return v === null || v === '' || v === undefined || isNaN(n) ? null : n; };
const nf = new Intl.NumberFormat('en-US');
const fmtT = (v) => { const n = num(v); return n === null ? '' : nf.format(n); };
const stClass = (s) => ({'가동':'st-ok','램프업':'st-ok','건설중':'st-warn','계획':'st-mute','미확인':'st-mute','지연':'st-bad','중단':'st-bad','파산':'st-bad','폐쇄':'st-bad'}[s] || 'st-mute');
const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; };
const isEst = (p) => p.cur_basis === '추정';

// ---- aggregates (chem '' = all)
const agg = (arr) => { let current=0,est=0,target=0,ship_2025=0,unknown_sites=0; arr.forEach(p=>{const c=num(p.current_t); if(c===null) unknown_sites++; current+=c||0; if(isEst(p)) est+=c||0; target+=num(p.target_t) ?? (c||0); ship_2025+=num(p.shipments_2025_t)||0;}); return {current,est,target,ship_2025,sites:arr.length,unknown_sites}; };
const pct = (a,b) => b ? Math.round(a/b*1000)/10 : 0;
const hierFor = (m, chem) => {
  const out = []; const ps = PLANTS.filter(p=>p.material===m && (!chem || p.chem===chem)); const tot = agg(ps);
  out.push({key:m, level:0, group:'', name:'__total__', ...tot, share_pct:100});
  GROUPS.forEach(g => { const gp = ps.filter(p=>p.group===g); if(!gp.length) return; const ga = agg(gp);
    out.push({key:m+'|'+g, level:1, group:g, name:g, ...ga, share_pct:pct(ga.current,tot.current)});
    [...new Set(gp.map(p=>p.parent))].forEach(c => { const sub = gp.filter(p=>p.parent===c); const ca = agg(sub); out.push({key:m+'|'+g+'|'+c, level:2, group:g, name:c, pid:sub[0].id, ...ca, share_pct:pct(ca.current,tot.current)}); });
  });
  return out;
};
const crossFor = (m, chem, axis) => {
  const map = new Map();
  PLANTS.filter(p=>p.material===m && (!chem || p.chem===chem)).forEach(p => { const site = p.site_country || '미확인'; const hq = axis==='region'?p.group:(axis==='company'?p.parent:p.hq);
    [[hq,site],[hq,'합계'],['합계',site],['합계','합계']].forEach(([h,s]) => { const key=h+'|'+s; const r = map.get(key) || {hq:h, site:s, current:0, target:0, sites:0, pid:p.id}; const c=num(p.current_t)||0; r.current+=c; r.target+=num(p.target_t) ?? c; r.sites++; map.set(key,r); }); });
  return [...map.values()];
};

// ---- state
const S = {mat:'양극재', chem:'', view:'tree', open:new Set(), hs:{key:'current',dir:-1}, sumMat:'양극재',
  x:{mat:'양극재', chem:'', metric:'current', axis:'region', rowSort:'size', hq:null, site:null}, xs:{key:'current_t',dir:-1},
  f:{group:'',site:'',material:'',chem:'',status:'',basis:''}, ps:{key:'',dir:-1}};
const cmpBy = (st, numKeys, getter) => (a,b) => { const k=st.key; if(numKeys.includes(k)){ const va=num(a[k]), vb=num(b[k]); if(va===null&&vb===null) return 0; if(va===null) return 1; if(vb===null) return -1; return (va-vb)*st.dir; } const ga = getter ? getter(a,k) : a[k], gb = getter ? getter(b,k) : b[k]; return String(ga??'').localeCompare(String(gb??''), LANG==='en'?'en':'ko')*st.dir; };
const marks = (sel, st) => document.querySelectorAll(sel+' th[data-sort]').forEach(th => { if(th.dataset.sort===st.key) th.setAttribute('aria-sort', st.dir<0?'descending':'ascending'); else th.removeAttribute('aria-sort'); });
const bindSort = (sel, st, redraw, textKeys) => { document.querySelectorAll(sel+' th[data-sort]').forEach(th => th.addEventListener('click', () => { const k=th.dataset.sort; if(st.key===k) st.dir=-st.dir; else { st.key=k; st.dir=textKeys.includes(k)?1:-1; } marks(sel,st); redraw(); })); marks(sel,st); };
const nameOf = (r) => r.name === '__total__' ? (LANG==='en' ? 'All' : '전체') : (r.level===2 ? (LANG==='en' && EN.plants && EN.plants[r.pid] && EN.plants[r.pid].parent ? EN.plants[r.pid].parent : r.name) : V(r.name));
const parentName = (p) => F(p,'parent');
const curCell = (p) => { const td = el('td','num'); if (num(p.current_t)===null){ td.textContent=''; return td;} td.textContent = fmtT(p.current_t); if (isEst(p)) { td.classList.add('est'); td.appendChild(el('span','badge',T('est'))); } return td; };

// ---- renderers
function renderTakeaway(){
  const sum = (g,m) => fmtT(PLANTS.filter(p=>p.group===g && p.material===m).reduce((s,p)=>s+(num(p.current_t)||0),0));
  const t = document.getElementById('takeaway'); t.textContent = '';
  [['양극재',['중국','한국','유럽','일본','미국']],['음극재',['중국','한국','일본','유럽','미국']]].forEach(([m,gs],i) => { t.append(i?T('tk2'):T('tk1')); gs.forEach((g,j)=>{ t.append(V(g)+' '); t.append(el('b','',sum(g,m))); t.append('t'+(j<gs.length-1?', ':T('tkEnd'))); }); });
  const lg = document.getElementById('legend'); lg.replaceChildren();
  GROUPS.forEach(g => { const s = el('span'); const sw = el('span','sw'); sw.style.background = gColor(g); s.append(sw, g==='기타'?T('other'):V(g)); lg.appendChild(s); });
}
function renderOverview(){
  const box = document.getElementById('overview'); box.replaceChildren();
  MATS.forEach(m => { const h = hierFor(m,''); const tot = h[0]; const row = el('div','ov-row'); const lab = el('div','ov-label'); lab.append(V(m), el('b','',fmtT(tot.current)+'t')); const bar = el('div','ov-bar');
    h.filter(r=>r.level===1&&r.current>0).sort((a,b)=>b.current-a.current).forEach(r => { const s = el('div','ov-seg', r.share_pct>=8 ? V(r.group)+' '+r.share_pct+'%' : ''); s.style.width=r.share_pct+'%'; s.style.background=gColor(r.group); s.title=V(r.group)+' '+fmtT(r.current)+'t ('+r.share_pct+'%)'; bar.appendChild(s); });
    row.append(lab,bar); box.appendChild(row); });
}
function renderSum(){
  const m = S.sumMat; const head = document.getElementById('sum-head'); const body = document.getElementById('sum-body'); head.replaceChildren(); body.replaceChildren();
  const htr = el('tr'); htr.appendChild(el('th','',T('cChem'))); GROUPS.forEach(g=>htr.appendChild(el('th','num',V(g)))); htr.appendChild(el('th','num',T('total'))); head.appendChild(htr);
  const cell = (arr) => { const a = agg(arr); const td = el('td','num', fmtT(a.current)); if (a.est) td.appendChild(el('span','est',' ('+fmtT(a.est)+')')); return td; };
  const ps = PLANTS.filter(p=>p.material===m);
  CHEMS[m].forEach(c => { const rowPs = ps.filter(p=>p.chem===c); if(!rowPs.length) return; const tr = el('tr'); tr.appendChild(el('td','',V(c))); GROUPS.forEach(g=>tr.appendChild(cell(rowPs.filter(p=>p.group===g)))); tr.appendChild(cell(rowPs)); body.appendChild(tr); });
  const tr = el('tr','tot'); tr.appendChild(el('td','',T('total'))); GROUPS.forEach(g=>tr.appendChild(cell(ps.filter(p=>p.group===g)))); tr.appendChild(cell(ps)); body.appendChild(tr);
}
function fillChemSelect(sel, m, val){ sel.replaceChildren(new Option(T('allChem'),'')); (m ? CHEMS[m] : [...CHEMS['양극재'],...CHEMS['음극재'],...CHEMS['전구체·원료']]).forEach(c=>sel.append(new Option(V(c),c))); sel.value = val || ''; }
function renderHier(){
  const tb = document.getElementById('hier-body'); tb.replaceChildren();
  const rows = hierFor(S.mat, S.chem);
  const base = cmpBy(S.hs,['current','est','share_pct','target','ship_2025','sites'], (r,k)=> k==='name'?nameOf(r):r[k]);
  const by = (a,b) => base(a,b) || (b.current-a.current) || (b.ship_2025-a.ship_2025);
  const ordered = rows.filter(r=>r.level===0); const rank = new Map();
  if (S.view==='flat') rows.filter(r=>r.level===2).sort(by).forEach((c,i)=>{rank.set(c.key,i+1); ordered.push(c);});
  else rows.filter(r=>r.level===1).sort(by).forEach(g => { ordered.push(g); if(S.open.has(g.key)) rows.filter(r=>r.level===2&&r.group===g.group).sort(by).forEach(c=>ordered.push(c)); });
  ordered.forEach(r => { const tr = el('tr','l'+r.level); const name = el('td','name');
    if (r.level===1){ const open=S.open.has(r.key); name.append(el('span','tg',open?'▾':'▸'), nameOf(r)); name.onclick=()=>{ open?S.open.delete(r.key):S.open.add(r.key); renderHier(); }; }
    else if (rank.has(r.key)) { name.textContent = rank.get(r.key)+'. '+nameOf(r)+' · '+V(r.group); name.style.paddingLeft='8px'; }
    else name.textContent = nameOf(r);
    tr.appendChild(name);
    const add = (t, cls) => tr.appendChild(el('td','num'+(cls?' '+cls:''),t));
    add(r.current ? fmtT(r.current) : (r.unknown_sites ? T('unknown') : '0'));
    add(r.est ? fmtT(r.est) : '', 'est');
    add(r.share_pct ? r.share_pct+'%' : '');
    const bc = el('td','barc'); if (r.level>0 && r.share_pct>0){ const b = el('div','hbar'); b.style.width=Math.min(100,r.share_pct)+'%'; b.style.background=gColor(r.group); b.style.opacity=r.level===2?'0.65':'1'; bc.appendChild(b);} tr.appendChild(bc);
    add(fmtT(r.target)); add(r.ship_2025?fmtT(r.ship_2025):''); add(fmtT(r.sites));
    tb.appendChild(tr); });
}
function renderCross(){
  const tb = document.getElementById('cross-body'); tb.replaceChildren(); const X = S.x;
  const rows = crossFor(X.mat, X.chem, X.axis);
  const get = (h,s) => rows.find(r=>r.hq===h&&r.site===s); const mk = X.metric;
  const label = (h) => h==='합계' ? T('total') : (X.axis==='company' ? (LANG==='en' && EN.plants && EN.plants[(rows.find(r=>r.hq===h)||{}).pid] ? EN.plants[rows.find(r=>r.hq===h).pid].parent || h : h) : V(h));
  const sites = rows.filter(r=>r.hq==='합계'&&r.site!=='합계').sort((a,b)=>(b.current-a.current)||(b.target-a.target)||(b.sites-a.sites)).map(r=>r.site);
  const hqs = rows.filter(r=>r.site==='합계'&&r.hq!=='합계').sort((a,b)=>{ if(X.rowSort==='name') return label(a.hq).localeCompare(label(b.hq), LANG==='en'?'en':'ko'); const d=(b[mk]-a[mk])||(b.current-a.current)||(b.sites-a.sites); return X.rowSort==='small'?-d:d; }).map(r=>r.hq);
  const head = el('tr'); head.appendChild(el('th','rowh', X.axis==='company'?T('cornerCo'):T('corner'))); [...sites,'합계'].forEach(s=>head.appendChild(el('th','num', s==='합계'?T('total'):V(s)))); tb.appendChild(head);
  [...hqs,'합계'].forEach(h => { const tr = el('tr', h==='합계'?'tot':''); tr.appendChild(el('th','rowh',label(h)));
    [...sites,'합계'].forEach(s => { const td = el('td','cell'+(s==='합계'?' tot':'')); const r = get(h,s);
      if (r){ td.textContent = fmtT(r[mk]); if(!r[mk]) td.classList.add('zero'); if(X.hq===h&&X.site===s) td.classList.add('sel'); td.onclick=()=>{ X.hq=h; X.site=s; renderCross(); renderXDetail(); }; }
      tr.appendChild(td); });
    tb.appendChild(tr); });
}
function renderXDetail(){
  const tb = document.getElementById('xdetail'); tb.replaceChildren(); const X = S.x; const info = document.getElementById('xsel');
  if (!X.hq){ info.textContent=T('xselEmpty'); return; }
  const f = X.axis==='region'?'group':(X.axis==='company'?'parent':'hq');
  const list = PLANTS.filter(p=>p.material===X.mat && (!X.chem||p.chem===X.chem) && (X.hq==='합계'||p[f]===X.hq) && (X.site==='합계'||(p.site_country||'미확인')===X.site));
  info.textContent = V(X.mat)+(X.chem?' · '+V(X.chem):'')+' · '+(X.axis==='company'?T('xselCo'):T('xselHq'))+' '+(X.hq==='합계'?T('total'):(X.axis==='company'&&list[0]?parentName(list[0]):V(X.hq)))+' · '+T('xselSite')+' '+(X.site==='합계'?T('total'):V(X.site));
  list.sort(cmpBy(S.xs,['current_t','target_t'], (p,k)=> ['parent','company','location','change'].includes(k)?F(p,k):V(p[k])));
  list.forEach(p => { const tr = el('tr'); tr.append(el('td','',V(p.hq)), el('td','',parentName(p)), el('td','',F(p,'company')), el('td','',V(p.chem)), el('td','',V(p.site_country)), el('td','',F(p,'location')), curCell(p), el('td','num',fmtT(p.target_t)), el('td','st '+stClass(p.status),V(p.status)), el('td','',F(p,'change'))); tb.appendChild(tr); });
}
function renderPlants(){
  const tb = document.getElementById('plants-body'); tb.replaceChildren(); const f = S.f;
  const list = PLANTS.filter(p=>(!f.group||p.group===f.group)&&(!f.site||p.site_country===f.site)&&(!f.material||p.material===f.material)&&(!f.chem||p.chem===f.chem)&&(!f.status||p.status===f.status)&&(!f.basis||p.cur_basis===f.basis));
  if (S.ps.key) list.sort(cmpBy(S.ps,['current_t','target_t'], (p,k)=> ['type','parent','company','location'].includes(k)?F(p,k):V(p[k])));
  list.forEach(p => { const tr = el('tr');
    tr.append(el('td','',V(p.group)), el('td','',V(p.hq)), el('td','',V(p.material)), el('td','',V(p.chem)), el('td','',F(p,'type')), el('td','',parentName(p)), el('td','',F(p,'company')), el('td','',V(p.site_country)), el('td','',F(p,'location')), curCell(p), el('td', isEst(p)?'est':'', V(p.cur_basis)), el('td','num',fmtT(p.target_t)), el('td','',p.target_year||''), el('td','st '+stClass(p.status),V(p.status)), el('td','',F(p,'customers')), el('td','',F(p,'change')), el('td','est', LANG==='en' ? (p.est_method_en||p.est_method||'') : (p.est_method||'')), el('td','',p.source_date||''));
    const td = el('td'); const url = p.est_source_url && isEst(p) ? p.est_source_url : p.source_url; if (url && String(url).startsWith('http')){ const a = el('a','', T('link')); a.href=url; a.target='_blank'; a.rel='noopener'; td.appendChild(a);} tr.appendChild(td); tb.appendChild(tr); });
}
function renderStatic(){
  const cb = document.getElementById('china-body'); cb.replaceChildren();
  CHINA.forEach((r,i) => { const e = LANG==='en' && EN.china && EN.china[i] ? EN.china[i] : r; const tr = el('tr'); tr.append(el('td','',e.metric), el('td','num',fmtT(r.value_t)), el('td','',e.period), el('td','',e.note), el('td','',e.source)); cb.appendChild(tr); });
  const pb = document.getElementById('policy-body'); pb.replaceChildren();
  POLICY.forEach(r => { const e = LANG==='en' && EN.policy && EN.policy[r.id] ? Object.assign({}, r, EN.policy[r.id]) : r; const tr = el('tr', r.next_check?'hot':''); ['date','region','item','impact'].forEach(k=>tr.appendChild(el('td','',e[k]||''))); tr.appendChild(el('td','',r.next_check||'')); const td = el('td'); if(r.source_url && r.source_url.startsWith('http')){ const a=el('a','',T('link')); a.href=r.source_url; a.target='_blank'; a.rel='noopener'; td.appendChild(a);} tr.appendChild(td); pb.appendChild(tr); });
  const u = document.getElementById('unv'); u.replaceChildren(); T('unv').forEach(x=>u.appendChild(el('li','',x)));
}
function fillFilters(){
  const opt = (sel, allKey, vals, cur) => { sel.replaceChildren(new Option(T(allKey),'')); vals.forEach(v=>sel.append(new Option(V(v),v))); sel.value = cur || ''; };
  opt(document.getElementById('f-group'),'allGroup',GROUPS,S.f.group);
  opt(document.getElementById('f-site'),'allSite',[...new Set(PLANTS.map(p=>p.site_country).filter(Boolean))].sort((a,b)=>V(a).localeCompare(V(b), LANG==='en'?'en':'ko')),S.f.site);
  opt(document.getElementById('f-material'),'allMat',MATS,S.f.material);
  fillChemSelect(document.getElementById('f-chem'), S.f.material, S.f.chem);
  opt(document.getElementById('f-status'),'allStatus',['가동','램프업','건설중','계획','지연','중단','파산','폐쇄','미확인'],S.f.status);
  opt(document.getElementById('f-basis'),'allBasis',['공식','보도','추정'],S.f.basis);
  fillChemSelect(document.getElementById('h-chem'), S.mat, S.chem);
  fillChemSelect(document.getElementById('x-chem'), S.x.mat, S.x.chem);
}
function applyLang(){
  document.documentElement.lang = LANG;
  document.title = T('title');
  document.querySelectorAll('[data-i]').forEach(e => { const v = T(e.dataset.i); if (typeof v === 'string') { if (v.includes('<br>')) { e.replaceChildren(); v.split('<br>').forEach((part,i)=>{ if(i) e.appendChild(document.createElement('br')); e.append(part); }); } else e.textContent = v; } });
  document.querySelectorAll('.tabs button[data-m]').forEach(b => b.textContent = V(b.dataset.m));
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.lang===LANG));
  fillFilters(); renderAll();
}
function renderAll(){ renderStatic(); renderTakeaway(); renderOverview(); renderSum(); renderHier(); renderCross(); renderXDetail(); renderPlants(); }

// ---- wiring
const tabs = (sel, set) => document.querySelectorAll(sel+' button').forEach(b => b.addEventListener('click', () => { document.querySelectorAll(sel+' button').forEach(x=>x.classList.toggle('on',x===b)); set(b.dataset.m); }));
tabs('#sum-tabs', v => { S.sumMat=v; renderSum(); });
tabs('#mat-tabs', v => { S.mat=v; S.chem=''; fillChemSelect(document.getElementById('h-chem'), v, ''); renderHier(); });
tabs('#x-tabs', v => { S.x.mat=v; S.x.chem=''; S.x.hq=null; S.x.site=null; fillChemSelect(document.getElementById('x-chem'), v, ''); renderCross(); renderXDetail(); });
document.getElementById('h-chem').onchange = (e) => { S.chem=e.target.value; renderHier(); };
document.getElementById('x-chem').onchange = (e) => { S.x.chem=e.target.value; S.x.hq=null; S.x.site=null; renderCross(); renderXDetail(); };
document.getElementById('h-view').onchange = (e) => { S.view=e.target.value; renderHier(); };
document.getElementById('open-all').onclick = () => { GROUPS.forEach(g=>S.open.add(S.mat+'|'+g)); renderHier(); };
document.getElementById('close-all').onclick = () => { S.open.clear(); renderHier(); };
document.getElementById('x-metric').onchange = (e) => { S.x.metric=e.target.value; renderCross(); };
document.getElementById('x-axis').onchange = (e) => { S.x.axis=e.target.value; S.x.hq=null; S.x.site=null; renderCross(); renderXDetail(); };
document.getElementById('x-rowsort').onchange = (e) => { S.x.rowSort=e.target.value; renderCross(); };
[['f-group','group'],['f-site','site'],['f-chem','chem'],['f-status','status'],['f-basis','basis']].forEach(([id,k]) => document.getElementById(id).addEventListener('change', (e) => { S.f[k]=e.target.value; renderPlants(); }));
document.getElementById('f-material').addEventListener('change', (e) => { S.f.material=e.target.value; S.f.chem=''; fillChemSelect(document.getElementById('f-chem'), S.f.material, ''); renderPlants(); });
document.querySelectorAll('.lang button').forEach(b => b.addEventListener('click', () => { LANG=b.dataset.lang; try { localStorage.setItem('cap-lang', LANG); } catch(e) {} applyLang(); }));
bindSort('#hier-table', S.hs, renderHier, ['name']);
bindSort('#cross-detail', S.xs, renderXDetail, ['hq','parent','company','chem','site_country','status']);
bindSort('#plants-table', S.ps, renderPlants, ['group','hq','material','chem','type','parent','company','site_country','cur_basis','target_year','status']);
try { const saved = localStorage.getItem('cap-lang'); if (saved === 'en' || saved === 'ko') LANG = saved; } catch(e) {}
applyLang();
</script>
